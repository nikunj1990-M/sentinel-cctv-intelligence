<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0f1420;color:#e8eef5;
    font-family:'Segoe UI',sans-serif;overflow:hidden}
  .wrap{width:1024px;height:768px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box}
  h1{font-size:36px;color:#ffb020;margin:0 0 28px 0;font-weight:700}
  .row{display:flex;gap:26px}
  .card{background:#171e2c;border-radius:8px;padding:18px 20px;width:210px;text-align:center}
  .big{font-size:30px;font-weight:800;color:#2b8cff}
  .lbl{font-size:12px;color:#8aa0b6;margin-top:8px}
</style></head>
<body>
  <div class="wrap">
    <h1>Scale &amp; Cost</h1>
    <div class="row">
      <div class="card"><div class="big">0</div><div class="lbl">new cameras required</div></div>
      <div class="card"><div class="big">Crores</div><div class="lbl">saved yearly in per-camera licensing</div></div>
      <div class="card"><div class="big">80,000+</div><div class="lbl">cameras, statewide scalability</div></div>
    </div>
  </div>
</body></html>
