<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0f1420;color:#e8eef5;
    font-family:'Segoe UI',sans-serif;overflow:hidden}
  .wrap{width:1024px;height:768px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box}
  h1{font-size:36px;color:#2b8cff;margin:0 0 28px 0;font-weight:700}
  .compare{display:flex;gap:30px}
  .col{background:#171e2c;border-radius:8px;padding:20px;width:280px}
  .col h2{font-size:17px;margin:0 0 12px 0;color:#8aa0b6}
  .col.new h2{color:#ffb020}
  .col ul{margin:0;padding-left:18px;font-size:14px;line-height:1.9;color:#c8d4e0}
</style></head>
<body>
  <div class="wrap">
    <h1>Beyond Border ANPR</h1>
    <div class="compare">
      <div class="col">
        <h2>Existing ANPR (borders only)</h2>
        <ul>
          <li>Fixed checkpoints only</li>
          <li>Reads number plates only</li>
          <li>No face or scene detection</li>
        </ul>
      </div>
      <div class="col new">
        <h2>Sentinel</h2>
        <ul>
          <li>Any existing camera, anywhere</li>
          <li>Vehicles, faces &amp; full scenes</li>
          <li>Works across the entire network</li>
        </ul>
      </div>
    </div>
  </div>
</body></html>
