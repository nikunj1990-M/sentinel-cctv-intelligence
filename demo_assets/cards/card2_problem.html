<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0f1420;color:#e8eef5;
    font-family:'Segoe UI',sans-serif;overflow:hidden}
  .wrap{width:1024px;height:768px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box}
  h1{font-size:38px;color:#ff6b6b;margin:0 0 22px 0;font-weight:700}
  .stat{font-size:68px;color:#ffb020;font-weight:800;line-height:1}
  .statlabel{font-size:17px;color:#8aa0b6;margin-bottom:28px}
  .row{display:flex;gap:24px;margin-top:20px}
  .card{background:#171e2c;border-left:4px solid #ff3b3b;border-radius:6px;padding:14px 18px;font-size:14px;
    color:#c8d4e0;max-width:230px}
</style></head>
<body>
  <div class="wrap">
    <h1>The Problem</h1>
    <div class="stat">80,000+</div>
    <div class="statlabel">CCTV cameras across Gujarat &mdash; working in isolation</div>
    <div class="row">
      <div class="card">5 separate departments, no unified system</div>
      <div class="card">No automatic, real-time alerts</div>
      <div class="card">Stolen vehicles &amp; wanted persons caught only after manual footage review</div>
    </div>
  </div>
</body></html>
